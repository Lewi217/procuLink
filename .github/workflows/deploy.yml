name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync --frozen --no-cache

      - name: Start Redis (Background)
        uses: supercharge/redis-github-action@1.8.0

      - name: Start FastAPI Server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REDIS_URL: "redis://localhost:6379/0"
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: "gpt-4.1"
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-large"
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8030 &
          # Wait for the server to be ready
          sleep 10
          curl --retry 5 --retry-delay 2 --retry-connrefused -s http://localhost:8030/docs > /dev/null

      - name: Run E2E Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REDIS_URL: "redis://localhost:6379/0"
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: "gpt-4.1"
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-large"
        run: |
          uv run python tests/test_admin.py
          uv run python tests/test_catalog.py
          uv run python tests/test_rfq.py

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping deployment."
            exit 1
          fi
          echo "Triggering deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

databases:
  - name: proculink-db
    databaseName: proculink
    user: proculink_user
    plan: free

services:
  - type: redis
    name: proculink-redis
    plan: free
    ipAllowList: [] # internal access only

  - type: web
    name: proculink-api
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proculink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: proculink-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # AI configuration - supply API key and Endpoint in Render dashboard
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        value: "gpt-4.1"
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: "text-embedding-3-large"

services:
  web:
    image: proculink-backend:latest
    build: .
    network_mode: host
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - PORT=8030
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    network_mode: host
